<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bloc Note</title>
<meta name="description" content="Tâches, emploi du temps et notes">
<meta name="theme-color" content="#5b5bd6">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bloc Note">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><img src="icon.svg" alt="" width="34" height="34"><div><b>Bloc Note</b><small id="sideDate"></small></div></div>
    <nav class="side-nav">
      <button data-act="nav" data-nav="today"><span data-ic="home"></span>Aujourd’hui<em id="cToday"></em></button>
      <button data-act="nav" data-nav="tasks"><span data-ic="listc"></span>Tâches<em id="cOpen"></em></button>
      <button data-act="nav" data-nav="planning"><span data-ic="calendar"></span>Emploi du temps</button>
      <button data-act="nav" data-nav="notes"><span data-ic="note"></span>Notes</button>
      <button data-act="nav" data-nav="settings"><span data-ic="settings"></span>Réglages</button>
    </nav>
    <div class="side-title">Listes <button class="mini" data-act="newList" aria-label="Nouvelle liste"><span data-ic="plus"></span></button></div>
    <div id="sideLists" class="side-lists"></div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>

<nav class="tabbar" aria-label="Navigation">
  <button data-act="nav" data-nav="today"><span data-ic="home"></span><small>Aujourd’hui</small></button>
  <button data-act="nav" data-nav="tasks"><span data-ic="listc"></span><small>Tâches</small></button>
  <button data-act="nav" data-nav="planning"><span data-ic="calendar"></span><small>Planning</small></button>
  <button data-act="nav" data-nav="notes"><span data-ic="note"></span><small>Notes</small></button>
  <button data-act="nav" data-nav="settings"><span data-ic="settings"></span><small>Réglages</small></button>
</nav>

<button class="fab" data-act="fab" aria-label="Ajouter"><span data-ic="plus"></span></button>
<div id="sheetRoot"></div>
<div id="toasts" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script src="app.js?v=7"></script>
</body>
</html>
